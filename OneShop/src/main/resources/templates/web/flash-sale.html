<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Sale - OneShop</title>
    <link rel="icon" href="/assets/img/icon.png" />
    <link rel="stylesheet" href="/fonts/flaticon/flaticon.css" />
    <link rel="stylesheet" href="/fonts/icofont/icofont.min.css" />
    <link rel="stylesheet" href="/fonts/fontawesome/fontawesome.min.css" />
    <link rel="stylesheet" href="/vendor/venobox/venobox.min.css" />
    <link rel="stylesheet" href="/vendor/slickslider/slick.min.css" />
    <link rel="stylesheet" href="/vendor/niceselect/nice-select.min.css" />
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/flash-sale.css" />
  </head>
  <body>
    <header th:replace="~{/web/fragments/header :: header}"></header>

    <!-- Flash Sale Banner -->
    <section
      class="flash-sale-banner"
      th:if="${activeSales != null && !activeSales.empty}"
    >
      <div class="container">
        <div class="flash-sale-header">
          <div class="flash-sale-title">
            <h1><i class="fas fa-fire"></i> FLASH SALE</h1>
          </div>
          <div class="flash-sale-countdown" id="flash-sale-main-countdown">
            <!-- Countdown will be inserted here by JavaScript -->
          </div>
        </div>
      </div>
    </section>

    <!-- Active Flash Sales -->
    <section
      class="inner-section flash-sale-section"
      th:if="${activeSales != null && !activeSales.empty}"
    >
      <div class="container">
        <div
          class="section-heading"
          style="text-align: center; margin-bottom: 40px"
        >
          <h2
            style="
              font-size: 2.5rem;
              font-weight: 800;
              color: #ff6b6b;
              text-transform: uppercase;
              letter-spacing: 2px;
            "
          >
            <i
              class="fas fa-fire"
              style="
                color: #ffd700;
                animation: firePulse 1.5s ease-in-out infinite;
              "
            ></i>
            Flash Sale Đang Diễn Ra
          </h2>
          <p style="font-size: 1.2rem; color: #666; margin-top: 10px">
            Nhanh tay mua sắm để không bỏ lỡ ưu đãi hấp dẫn!
          </p>
        </div>

        <div class="row" th:each="flashSale : ${activeSales}">
          <div class="col-12">
            <div class="flash-sale-card">
              <div class="flash-sale-info">
                <div
                  class="flash-sale-timer"
                  th:attr="data-end-time=${flashSale.endTime}"
                >
                  <div
                    class="countdown"
                    th:id="'countdown-' + ${flashSale.flashSaleId}"
                  ></div>
                </div>
              </div>
              <div
                class="flash-sale-products"
                th:id="'products-' + ${flashSale.flashSaleId}"
              >
                <!-- Products will be loaded by JavaScript -->
                <div class="loading">Đang tải sản phẩm...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Upcoming Flash Sales -->
    <section
      class="inner-section flash-sale-section"
      th:if="${upcomingSales != null && !upcomingSales.empty}"
    >
      <div class="container">
        <div class="section-heading">
          <h2><i class="fas fa-clock"></i> Flash Sale Sắp Diễn Ra</h2>
        </div>

        <div class="row" th:each="flashSale : ${upcomingSales}">
          <div class="col-12">
            <div class="flash-sale-card upcoming">
              <div class="flash-sale-info">
                <div
                  class="flash-sale-timer"
                  th:attr="data-start-time=${flashSale.startTime}"
                >
                  <div
                    class="countdown"
                    th:id="'start-countdown-' + ${flashSale.flashSaleId}"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- No Flash Sale Message -->
    <section
      class="inner-section"
      th:if="${(activeSales == null || activeSales.empty) && (upcomingSales == null || upcomingSales.empty)}"
    >
      <div class="container">
        <div class="text-center" style="padding: 60px 20px">
          <i
            class="fas fa-fire"
            style="font-size: 80px; color: #ddd; margin-bottom: 20px"
          ></i>
          <h3 style="color: #666; margin-bottom: 10px">
            Hiện tại chưa có Flash Sale nào
          </h3>
          <p style="color: #999">
            Hãy quay lại sau để xem các chương trình Flash Sale hấp dẫn!
          </p>
          <a href="/" class="btn btn-inline" style="margin-top: 20px">
            <i class="icofont-home"></i> Về trang chủ
          </a>
        </div>
      </div>
    </section>

    <footer th:replace="~{/web/fragments/footer :: footer}"></footer>

    <!-- Scripts -->
    <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/vendor/slickslider/slick.min.js"></script>
    <script src="/vendor/venobox/venobox.min.js"></script>
    <script src="/vendor/niceselect/nice-select.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/flash-sale-api.js"></script>
    <script src="/js/flash-sale.js"></script>

    <script th:inline="javascript">
      // Initialize flash sale page
      document.addEventListener("DOMContentLoaded", function () {
        // Initialize countdown timers for active sales
        var activeSales = /*[[${activeSales}]]*/ [];
        if (activeSales && activeSales.length > 0) {
          activeSales.forEach(function (sale) {
            if (sale.endTime) {
              const endTimeSeconds = FlashSaleTimer.dateToSeconds(sale.endTime);
              FlashSaleTimer.initCountdown(
                "countdown-" + sale.flashSaleId,
                endTimeSeconds
              );

              // Load products for this flash sale
              FlashSaleAPI.getFlashSaleProducts(sale.flashSaleId).then(
                function (data) {
                  if (data.success && data.products) {
                    renderFlashSaleProducts(
                      "products-" + sale.flashSaleId,
                      data.products
                    );
                  }
                }
              );
            }
          });

          // Main countdown for first active sale
          if (activeSales[0].endTime) {
            const endTimeSeconds = FlashSaleTimer.dateToSeconds(
              activeSales[0].endTime
            );
            FlashSaleTimer.initCountdown(
              "flash-sale-main-countdown",
              endTimeSeconds
            );
          }
        }

        // Initialize countdown timers for upcoming sales
        var upcomingSales = /*[[${upcomingSales}]]*/ [];
        if (upcomingSales && upcomingSales.length > 0) {
          upcomingSales.forEach(function (sale) {
            if (sale.startTime) {
              const startTimeSeconds = FlashSaleTimer.dateToSeconds(
                sale.startTime
              );
              FlashSaleTimer.initStartCountdown(
                "start-countdown-" + sale.flashSaleId,
                startTimeSeconds,
                function () {
                  // Reload page when flash sale starts
                  location.reload();
                }
              );
            }
          });
        }
      });

      // Render flash sale products
      function renderFlashSaleProducts(containerId, products) {
        const container = document.getElementById(containerId);
        if (!container) return;

        if (!products || products.length === 0) {
          container.innerHTML =
            '<div class="no-products">Chưa có sản phẩm trong flash sale này</div>';
          return;
        }

        let html = '<div class="row">';
        products.forEach(function (product) {
          if (!product.isAvailable) return;

          const discount = product.discountPercentage || 0;
          const remaining = product.remainingQuantity || 0;

          const progressPercent = Math.min(
            (product.soldQuantity / product.quantityLimit) * 100,
            100
          );
          const isLowStock = remaining <= 10;

          html += `
            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
              <div class="product-card flash-sale-product-card" data-product-id="${
                product.productId
              }" style="
                background: white;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.2);
                border: 2px solid #ff6b6b;
                transition: all 0.3s ease;
                position: relative;
              ">
                <div class="product-media" style="position: relative; overflow: hidden;">
                  <div class="product-label" style="position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 5px;">
                    <label class="label-text flash" style="
                      background: linear-gradient(135deg, #ff6b6b, #ff4757);
                      color: white;
                      padding: 6px 12px;
                      border-radius: 5px;
                      font-size: 12px;
                      font-weight: 900;
                      text-transform: uppercase;
                      letter-spacing: 1px;
                      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                      animation: pulse 2s infinite;
                    ">FLASH SALE</label>
                    <label class="label-text sale" style="
                      background: #ffd700;
                      color: #333;
                      padding: 6px 12px;
                      border-radius: 5px;
                      font-size: 14px;
                      font-weight: 900;
                      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    ">-${discount}%</label>
                  </div>
                  ${
                    isLowStock
                      ? `
                    <div style="position: absolute; top: 10px; right: 10px; z-index: 10; background: #dc3545; color: white; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 700;">
                      SẮP HẾT HÀNG
                    </div>
                  `
                      : ""
                  }
                  <a class="product-image" href="/productDetail?id=${
                    product.productId
                  }" style="display: block; overflow: hidden;">
                    <img src="${
                      product.productImage ||
                      "/assets/img/examples/product1.jpg"
                    }" alt="${product.productName}" style="
                      width: 100%;
                      height: 250px;
                      object-fit: cover;
                      transition: transform 0.3s ease;
                    " />
                  </a>
                </div>
                <div class="product-content" style="padding: 20px;">
                  <h6 class="product-name" style="margin-bottom: 15px; min-height: 48px;">
                    <a href="/productDetail?id=${product.productId}" style="
                      color: #333;
                      font-size: 16px;
                      font-weight: 700;
                      text-decoration: none;
                      display: -webkit-box;
                      -webkit-line-clamp: 2;
                      -webkit-box-orient: vertical;
                      overflow: hidden;
                    ">${product.productName}</a>
                  </h6>
                  <div class="product-price" style="margin-bottom: 15px;">
                    <span class="flash-price" style="
                      color: #ff6b6b;
                      font-size: 24px;
                      font-weight: 900;
                      display: block;
                    ">${formatPrice(product.flashSalePrice)}</span>
                    <del class="original-price" style="
                      color: #999;
                      font-size: 16px;
                      text-decoration: line-through;
                    ">${formatPrice(product.originalPrice)}</del>
                  </div>
                  <div class="flash-sale-progress" style="margin-bottom: 15px;">
                    <div class="progress-info">
                      <span style="color: #ff6b6b; font-weight: 700;">Đã bán: ${
                        product.soldQuantity
                      }/${product.quantityLimit}</span>
                      <span style="color: #28a745; font-weight: 700;">Còn lại: ${remaining}</span>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                  </div>
                  <div class="product-action">
                    <a href="/productDetail?id=${
                      product.productId
                    }" class="btn btn-inline" style="
                      background: linear-gradient(135deg, #ff6b6b, #ff4757);
                      color: white;
                      border: none;
                      padding: 14px 24px;
                      font-weight: 800;
                      font-size: 16px;
                      border-radius: 25px;
                      text-transform: uppercase;
                      letter-spacing: 1px;
                      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
                      transition: all 0.3s ease;
                      display: block;
                      width: 100%;
                      text-align: center;
                      text-decoration: none;
                    ">
                      <i class="icofont-cart"></i> Mua Ngay
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        html += "</div>";

        container.innerHTML = html;

        // Add hover effects to product cards
        const productCards = container.querySelectorAll(
          ".flash-sale-product-card"
        );
        productCards.forEach(function (card) {
          const productImage = card.querySelector(".product-image img");
          if (productImage) {
            card.addEventListener("mouseenter", function () {
              productImage.style.transform = "scale(1.1)";
            });
            card.addEventListener("mouseleave", function () {
              productImage.style.transform = "scale(1)";
            });
          }
        });
      }

      function formatPrice(price) {
        return new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
        }).format(price);
      }
    </script>
  </body>
</html>
