# Profile "prod" — VPS, Docker tren VPS, hoac bat ky server deploy that nao.
# Kich hoat: SPRING_PROFILES_ACTIVE=prod (hoac trong Dockerfile: ENV SPRING_PROFILES_ACTIVE=prod)
#
# Bat buoc dat bien moi truong tren server (khong hard-code mat khau trong file nay):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   APP_BASE_URL (https://ten-mien-cua-ban) — dung cho link email + callback OAuth / MoMo / PayOS mac dinh
# OAuth redirect-uri: dung {baseUrl} trong application.properties (khong ghi de o day).
# Google/Facebook Console: them MỌI callback ban dung, vi du:
#   https://ten-mien.com/login/oauth2/code/google
#   http://IP:8080/login/oauth2/code/google
#   http://localhost:8080/login/oauth2/code/google
# Nginx/HTTPS: forward headers de {baseUrl} la https (xem server.forward-headers-strategy ben duoi).

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_nationalized_character_data=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.base-url=${APP_BASE_URL}

momo.return.url=${MOMO_RETURN_URL:${app.base-url}/payment/momo/return}
momo.notify.url=${MOMO_NOTIFY_URL:${app.base-url}/payment/momo/notify}

payos.return-url=${PAYOS_RETURN_URL:${app.base-url}/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:${app.base-url}/payos/cancel}

# Truoc Nginx/Traefik (HTTPS): de Spring tinh dung scheme/host cho {baseUrl} OAuth + link tuyet doi.
server.forward-headers-strategy=framework
