# Profile "prod" — VPS, Docker tren VPS, hoac bat ky server deploy that nao.
# Kich hoat: SPRING_PROFILES_ACTIVE=prod (hoac trong Dockerfile: ENV SPRING_PROFILES_ACTIVE=prod)
#
# Bat buoc dat bien moi truong tren server (khong hard-code mat khau trong file nay):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   APP_BASE_URL (https://ten-mien-cua-ban) — dung cho link email + callback OAuth / MoMo / PayOS mac dinh
# Tuy chon: OAUTH2_GOOGLE_REDIRECT_URI, OAUTH2_FACEBOOK_REDIRECT_URI neu URL khac ${app.base-url}/login/oauth2/code/...

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_nationalized_character_data=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.base-url=${APP_BASE_URL}

spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_GOOGLE_REDIRECT_URI:${app.base-url}/login/oauth2/code/google}
spring.security.oauth2.client.registration.facebook.redirect-uri=${OAUTH2_FACEBOOK_REDIRECT_URI:${app.base-url}/login/oauth2/code/facebook}

momo.return.url=${MOMO_RETURN_URL:${app.base-url}/payment/momo/return}
momo.notify.url=${MOMO_NOTIFY_URL:${app.base-url}/payment/momo/notify}

payos.return-url=${PAYOS_RETURN_URL:${app.base-url}/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:${app.base-url}/payos/cancel}
